<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- TODO #14: the h_OURs logo (public/hours-logo-source.png) only exists as a raster export,
         so there's no vector favicon to point a `type="image/svg+xml"` link at anymore — a browser
         that wants more than favicon.ico's 48x48 falls back to the manifest's own icons list
         (vite.config.ts) instead, same as any site that never had an SVG favicon in the first
         place. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16825a" />
    <!-- iOS Safari ignores the web manifest's display/name fields for "Add
         to Home Screen" and needs these two tags instead to open standalone
         (no browser bar) with the right name under the icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="h_OURs" />
    <title>h_OURs</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
